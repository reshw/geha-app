name: Scheduled jobs

# Vercel Cron 대신 GitHub Actions 로 정기 작업을 호출한다. (정시 보장은 없고 수 분~수십 분 지연될 수 있음)
# - 스케줄 워크플로는 기본 브랜치(main)에 있어야 동작한다.
# - 필요 설정: Secret CRON_SECRET (Vercel 의 CRON_SECRET 과 같은 값), Variable APP_URL (예: https://xxx.vercel.app)

on:
  schedule:
    - cron: '0 * * * *'   # 매시간: 정산 자동 마감 (함수가 자체 설정의 요일/시각을 보고 실행 여부를 결정)
    - cron: '0 1 * * *'   # 매일 UTC 01:00 (KST 10:00): 운영비 승인 독려 메일
  workflow_dispatch:
    inputs:
      job:
        description: '수동 실행할 작업'
        type: choice
        options:
          - settlement-auto-close
          - send-pending-expense-reminder
        default: settlement-auto-close

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call API
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB_INPUT: ${{ inputs.job }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL(variable)와 CRON_SECRET(secret)을 설정하세요." >&2
            exit 1
          fi

          case "${SCHEDULE:-}" in
            "0 * * * *") job=settlement-auto-close ;;
            "0 1 * * *") job=send-pending-expense-reminder ;;
            *)           job="${JOB_INPUT:-settlement-auto-close}" ;;
          esac

          echo "Calling /api/${job}"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 10 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/${job}"
          echo
